name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (defaults to next version)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require main
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = main

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo install
        run: cargo install --locked tickbox cargo-semver-checks

      - name: Install Rust nightly (needed for UI?)
        run: rustup toolchain install nightly --profile minimal
      - name: Rustup install nightly clippy
        run: rustup component add --toolchain nightly clippy
      - name: Rustup install wasm32
        run: rustup target add wasm32-unknown-unknown
      - name: Moar rustup
        run: rustup component add rust-src --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libfftw3-dev libvolk-dev

      - name: Run release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLEANUP=true tickbox --dir tickbox/bump_version --disable-tui --max-concurrency=1

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (defaults to next version)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          count=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow runtests.yml \
            --commit "$SHA" \
            --status success \
            --json databaseId \
            --jq 'length')

          if [ "$count" -eq 0 ]; then
            echo "::error::No successful CI run for $SHA"
            exit 1
          fi
  release:
    needs: check-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require main
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: test "$RELEASE_BRANCH" = main

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo install
        run: cargo install --locked tickbox cargo-semver-checks wasm-pack

      - name: Install Rust nightly (needed for UI?)
        run: rustup toolchain install nightly --profile minimal
      - name: Rustup install nightly clippy
        run: rustup component add --toolchain nightly clippy
      - name: Rustup install wasm32
        run: rustup target add wasm32-unknown-unknown
      - name: Moar rustup
        run: rustup component add rust-src rustfmt --toolchain nightly-x86_64-unknown-linux-gnu

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librtlsdr-dev libsoapysdr-dev libfftw3-dev libvolk-dev

      - name: Run release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CLEANUP=true tickbox --dir tickbox/bump_version --disable-tui --max-concurrency=1

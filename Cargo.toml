[package]
name = "sparslog"
version = "0.1.15"
edition = "2024"
license = "MIT"
authors = ["Thomas Habets <thomas@habets.se>"]
readme = "README.md"
repository = "https://github.com/ThomasHabets/sparslog"
description = "SDR receiver for IKEA sparsnäs"
keywords = ["SDR", "ikea"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
ctrlc = { version = "3", optional = true }
log = "0.4"
num = "0.4"
rustradio = { version = "0.20.0", features = ["fast-math"] }
stderrlog = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
console-subscriber = { version = "0.4.1", optional = true }
tokio = { version = "1.45.0", optional = true }
prometheus = { version = "0.14.0", features = ["process", "push"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustradio = { version = "0.20.0", features = ["wasm"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["cli"]
cli = [
    "dep:ctrlc", "dep:stderrlog", "dep:clap", "dep:tokio", "dep:prometheus",
    "rustradio/rtlsdr", "rustradio/async", "rustradio/unstable",
]
volk = ["rustradio/volk"]
tokio-unstable = ["cli", "dep:console-subscriber", "tokio/tracing", "rustradio/tokio-unstable"]

[[bin]]
name = "sparslog"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "sparslog-async"
path = "src/main_async.rs"
required-features = ["cli"]

[lib]
path = "src/lib.rs"

[patch.crates-io]
#rustradio = { path = "../rustradio" }

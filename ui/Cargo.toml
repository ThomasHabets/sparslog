[workspace]

[package]
name = "sparslog-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WASM viewer for sparslog IQ streams"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
async-channel = { version = "2.5", default-features = false }
console_error_panic_hook = "0.1.7"
log = "0.4"
rustradio = { version = "0.18.7", features = ["wasm", "unstable"] }
rustradio-ui = { version = "0.1.27", features = ["unstable"] }
rustradio_macros = "0.18.6"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.102", features = ["Location", "Url", "Window"] }


[patch.crates-io]
#rustradio = { path = "../../rustradio" }
#rustradio-ui = { path = "../../rustradio/rustradio-ui" }

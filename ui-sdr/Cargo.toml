[workspace]

[package]
name = "sparslog-ui-sdr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser RTL-SDR Sparsnäs receiver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-util = "0.3"
sparslog = { path = "..", default-features = false }
rtlsdr-pure = "0.2.3"
nusb = "0.2.7"
js-sys = "0.3"
async-channel = { version = "2.5", default-features = false }
console_error_panic_hook = "0.1.7"
log = "0.4"
rustradio = { version = "0.20", features = ["wasm", "unstable"] }
rustradio-ui = { version = "0.2.5", features = ["unstable"] }
rustradio_macros = "0.20"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.102", features = ["Location", "Url", "Window"] }


[patch.crates-io]
#rustradio = { path = "../../rustradio" }
#rustradio-ui = { path = "../../rustradio-ui" }
